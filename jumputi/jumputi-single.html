<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1d2a6a">
<title>ジャンプチ ヒーローズ 再現版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ジャンプチ ヒーローズ (ファンメイド再現版) スタイル
   ============================================================ */
:root {
  --red: #ff4b5c; --green: #35c45a; --blue: #3b86ff; --yellow: #ffbd1f; --heart: #ff73b0;
  --ink: #2a1a2e; --gold: #ffcf3a;
  --font: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Meiryo', sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #0d0a18; font-family: var(--font); color: #fff; overscroll-behavior: none; }
body { user-select: none; -webkit-user-select: none; }
button { font-family: inherit; cursor: pointer; }
img { -webkit-user-drag: none; }
#app { position: relative; max-width: 480px; height: 100vh; height: 100dvh; margin: 0 auto; overflow: hidden; background: #1b1531; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; }

/* 属性カラー */
.a-red { --ac: #ff4b5c; --ac2: #b3172c; --acl: #ffc2c8; }
.a-green { --ac: #35c45a; --ac2: #16803a; --acl: #c4f2cf; }
.a-blue { --ac: #3b86ff; --ac2: #1550b8; --acl: #c4dcff; }
.a-yellow { --ac: #ffbd1f; --ac2: #b97a00; --acl: #fff0bf; }
.t-red { color: var(--red); } .t-green { color: var(--green); } .t-blue { color: var(--blue); } .t-yellow { color: var(--yellow); }
.hearttxt { color: var(--heart); font-weight: 900; }
.attr-ic { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; font-size: 10px; font-weight: 900; color: #fff;
  background: var(--ac); border: 1.5px solid #fff; text-shadow: 0 1px 1px rgba(0,0,0,.4); vertical-align: middle; flex: none; }

/* ボタン */
.btn { border: none; border-radius: 99px; padding: 10px 22px; font-size: 15px; font-weight: 900; color: #5a3200; background: linear-gradient(#ffe56b, #ffb52e);
  box-shadow: 0 4px 0 #b06a00, inset 0 2px 0 rgba(255,255,255,.6); display: inline-flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1.15; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b06a00; }
.btn:disabled { filter: grayscale(1) brightness(.8); }
.btn small { font-size: 10px; font-weight: 800; display: flex; align-items: center; gap: 2px; }
.btn.gray { background: linear-gradient(#f4f4f8, #c9cad6); color: #3a3a4a; box-shadow: 0 4px 0 #7a7b8a, inset 0 2px 0 #fff; }
.btn.red { background: linear-gradient(#ff8a8a, #e8343a); color: #fff; box-shadow: 0 4px 0 #8a1218; }
.btn.go { background: linear-gradient(#ffd15a, #ff7a1e); color: #fff; text-shadow: 0 1px 2px #a03a00; font-size: 18px; padding: 10px 32px; box-shadow: 0 4px 0 #a03a00; }
.btn.sm { padding: 6px 14px; font-size: 12px; }
.btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
.chip { border: 2px solid rgba(255,255,255,.5); background: rgba(0,0,0,.25); color: #fff; border-radius: 99px; padding: 4px 10px; font-size: 11px; font-weight: 800; }
.chip.on { background: #fff; color: #3a2a5a; }
.chip.a-red, .chip.a-green, .chip.a-blue, .chip.a-yellow { border-color: var(--ac); }
.chip.on.a-red, .chip.on.a-green, .chip.on.a-blue, .chip.on.a-yellow { background: var(--ac); color: #fff; }

.ic-ruby, .ic-coin, .ic-sta { display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-right: 2px; flex: none; }
.ic-ruby { background: linear-gradient(135deg, #ff8ab0, #e8144a); clip-path: polygon(50% 0, 100% 35%, 80% 100%, 20% 100%, 0 35%); }
.ic-coin { background: radial-gradient(circle at 35% 30%, #fff6b0, #f2b21e 60%, #b97a00); border-radius: 50%; }
.ic-sta { background: linear-gradient(#9ef06a, #2fb04a); clip-path: polygon(55% 0, 15% 55%, 45% 55%, 35% 100%, 85% 40%, 55% 40%); }

/* トースト・ダイアログ */
.toast { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 999; background: rgba(20,10,40,.92); color: #fff; padding: 12px 20px; border-radius: 14px;
  font-weight: 800; font-size: 14px; border: 2px solid rgba(255,255,255,.4); animation: toastIn .25s; pointer-events: none; text-align: center; max-width: 80vw; }
.toast.out { opacity: 0; transition: opacity .4s; }
@keyframes toastIn { from { transform: translate(-50%, -30%); opacity: 0; } }
.dialog-bg { position: fixed; inset: 0; z-index: 500; background: rgba(8,4,20,.72); display: flex; align-items: center; justify-content: center; padding: 16px; animation: fadeIn .2s; }
@keyframes fadeIn { from { opacity: 0; } }
.dialog { width: 100%; max-width: 360px; max-height: 88vh; overflow-y: auto; background: linear-gradient(#fffdf4, #fff3d6); color: #3a2a3a; border-radius: 18px; padding: 16px;
  border: 4px solid #ffcf3a; box-shadow: 0 8px 0 #b06a00, 0 0 40px rgba(0,0,0,.5); animation: popIn .25s; text-align: center; }
.dialog.wide { max-width: 440px; }
@keyframes popIn { from { transform: scale(.8); opacity: 0; } }
.dialog h3 { margin: 0 0 10px; font-size: 18px; color: #d2521e; font-weight: 900; }
.dialog p { margin: 6px 0; font-size: 13px; line-height: 1.6; }
.dialog .sub { font-size: 11px; color: #7a6a7a; }
.dialog .big-txt { font-size: 28px; font-weight: 900; color: #e8343a; margin: 4px 0; }
.help { text-align: left; background: rgba(255,207,58,.16); border-radius: 12px; padding: 8px 12px; margin: 6px 0; }
.help p { font-size: 12.5px; margin: 5px 0; line-height: 1.55; }
.set-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 4px; border-bottom: 1px dashed #e6d6a8; font-weight: 800; font-size: 13px; }
.set-row input { font: inherit; font-size: 13px; padding: 4px 8px; border-radius: 8px; border: 2px solid #e6c66a; width: 150px; }

/* 顔カード */
.fc { position: relative; width: 100%; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: linear-gradient(160deg, var(--acl, #ddd), var(--ac, #999) 70%, var(--ac2, #666));
  border: 3px solid var(--ac, #999); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
.fc img { width: 100%; height: 100%; display: block; }
.fc.r5 { border-color: #ffd84a; box-shadow: 0 0 0 1.5px #a86a00, 0 2px 0 rgba(0,0,0,.35); }
.fc.r4 { border-color: #d8dde8; }
.fc-r { position: absolute; left: 2px; bottom: 0; font-size: 9px; color: #ffe86b; text-shadow: 0 0 2px #000, 0 0 2px #000; letter-spacing: -1px; }
.fc-lv { position: absolute; right: 2px; top: 1px; font-size: 9px; font-weight: 900; color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000; }
.fc-lb { position: absolute; left: 0; right: 0; top: 40%; text-align: center; background: rgba(0,0,0,.6); font-size: 9px; font-weight: 900; color: #fff; padding: 1px 0; }
.fc.unknown { background: #3a3550; border-color: #55506a; display: flex; align-items: center; justify-content: center; }
.fc.unknown span { font-size: 22px; font-weight: 900; color: #6a6488; }
.fc.sm { border-width: 2px; border-radius: 9px; }

/* ============================================================
   タイトル
   ============================================================ */
.title { align-items: center; justify-content: center; cursor: pointer; background: #56c3ff; }
.tt-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tt-rays { position: absolute; left: 50%; top: 30%; width: 900px; height: 900px; margin: -450px 0 0 -450px; opacity: .35;
  background: repeating-conic-gradient(#fff 0 8deg, transparent 8deg 22deg); animation: spin 30s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.tt-logo { position: relative; text-align: center; margin-top: -60px; animation: logoIn .8s cubic-bezier(.2,1.6,.4,1); }
@keyframes logoIn { from { transform: scale(.3) rotate(-10deg); opacity: 0; } }
.tt-l1, .tt-l2 { font-weight: 900; font-style: italic; line-height: 1; letter-spacing: -.02em; }
.tt-l1 { font-size: 64px; color: #ffe23b; -webkit-text-stroke: 3px #c0141e; text-shadow: 0 6px 0 #c0141e, 0 10px 12px rgba(0,0,0,.35); transform: rotate(-4deg); }
.tt-l2 { font-size: 46px; color: #fff; -webkit-text-stroke: 3px #1a3a9a; text-shadow: 0 5px 0 #1a3a9a, 0 8px 10px rgba(0,0,0,.35); margin-top: 4px; transform: rotate(-4deg); }
.tt-sub { display: inline-block; margin-top: 14px; padding: 3px 14px; background: #e8343a; border-radius: 99px; font-weight: 900; font-size: 13px; border: 2px solid #fff; }
.tt-parade { position: absolute; bottom: 92px; left: 0; right: 0; display: flex; justify-content: center; }
.tt-parade img { width: 15%; max-width: 70px; margin: 0 -2%; animation: bob 1.1s ease-in-out infinite alternate; }
.tt-tap { position: absolute; bottom: 52px; font-size: 22px; font-weight: 900; color: #fff; text-shadow: 2px 0 0 #1a3a9a, -2px 0 0 #1a3a9a, 0 2px 0 #1a3a9a, 0 -2px 0 #1a3a9a, 1.4px 1.4px 0 #1a3a9a, -1.4px 1.4px 0 #1a3a9a, 1.4px -1.4px 0 #1a3a9a, -1.4px -1.4px 0 #1a3a9a; animation: blink 1.1s infinite; }
@keyframes blink { 50% { opacity: .2; } }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-8px); } }
.tt-note { position: absolute; bottom: 8px; left: 10px; right: 10px; font-size: 9.5px; text-align: center; color: #1a2a5a; font-weight: 700; line-height: 1.4; }

/* ============================================================
   メニュー共通 (ヘッダー・ナビ)
   ============================================================ */
.menu { background: linear-gradient(#4fb8ff, #a8e2ff 40%, #fff3c4); }
.hd { flex: none; display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: linear-gradient(#2a3a8a, #1d2a6a); border-bottom: 3px solid #ffcf3a; z-index: 5; }
.hd-rank { display: flex; flex-direction: column; align-items: center; background: #ffcf3a; color: #5a3200; border-radius: 10px; padding: 1px 7px; line-height: 1; min-width: 44px; }
.hd-rank small { font-size: 8px; font-weight: 900; }
.hd-rank b { font-size: 16px; font-weight: 900; }
.hd-rexp { width: 100%; height: 3px; background: rgba(0,0,0,.2); border-radius: 2px; margin: 1px 0 2px; }
.hd-rexp i { display: block; height: 100%; background: #e8343a; border-radius: 2px; }
.hd-sta { flex: 1; display: flex; align-items: center; gap: 3px; min-width: 0; }
.hd-stabar { flex: 1; height: 15px; background: rgba(0,0,0,.4); border-radius: 99px; position: relative; overflow: hidden; border: 1.5px solid rgba(255,255,255,.4); }
.hd-stabar i { display: block; height: 100%; background: linear-gradient(90deg, #6fe03a, #b8f05a); }
.hd-stabar span { position: absolute; inset: 0; font-size: 10px; font-weight: 900; text-align: center; line-height: 12px; text-shadow: 0 1px 2px #000; }
.hd-sta em { font-style: normal; font-size: 9px; color: #bfe0ff; min-width: 26px; }
.hd-res { display: flex; flex-direction: column; gap: 1px; font-size: 11px; }
.hd-res span { background: rgba(0,0,0,.35); border-radius: 99px; padding: 0 8px 0 5px; display: flex; align-items: center; min-width: 74px; }
.hd-res b { flex: 1; text-align: right; }
.mn { flex: 1; overflow-y: auto; position: relative; -webkit-overflow-scrolling: touch; }
.nv { flex: none; display: flex; background: linear-gradient(#2a3a8a, #18215a); border-top: 3px solid #ffcf3a; padding: 3px 2px calc(3px + env(safe-area-inset-bottom)); }
.nv button { flex: 1; background: none; border: none; color: #9fb4ff; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 3px 0; font-size: 10px; font-weight: 900; border-radius: 10px; }
.nv svg { width: 24px; height: 24px; fill: currentColor; }
.nv button.on { color: #ffe23b; background: rgba(255,255,255,.12); }
.ttl { margin: 10px 12px 6px; font-size: 21px; font-weight: 900; color: #fff; text-shadow: 2px 0 0 #1a3a9a, -2px 0 0 #1a3a9a, 0 2px 0 #1a3a9a, 0 -2px 0 #1a3a9a, 1.4px 1.4px 0 #1a3a9a, -1.4px 1.4px 0 #1a3a9a, 1.4px -1.4px 0 #1a3a9a, -1.4px -1.4px 0 #1a3a9a, 0 4px 0 #1a3a9a; }
.ttl small { font-size: 13px; }
.sub { font-size: 11px; color: #5a5a7a; text-align: center; margin: 6px 12px; line-height: 1.5; }
.flt-row { display: flex; gap: 5px; flex-wrap: wrap; padding: 0 12px 6px; }

/* ホーム */
.home { position: relative; min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding-bottom: 14px; }
.home-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.home-title { position: relative; margin-top: 10px; font-weight: 900; font-size: 18px; color: #fff; text-shadow: 1.6px 0 0 #c0141e, -1.6px 0 0 #c0141e, 0 1.6px 0 #c0141e, 0 -1.6px 0 #c0141e, 1.1px 1.1px 0 #c0141e, -1.1px 1.1px 0 #c0141e, 1.1px -1.1px 0 #c0141e, -1.1px -1.1px 0 #c0141e, 0 3px 0 #c0141e; background: rgba(255,255,255,.25); padding: 2px 16px; border-radius: 99px; }
.home-leader { position: relative; margin-top: 8px; display: flex; flex-direction: column; align-items: center; }
.home-leader img { width: 190px; animation: bob 1.2s ease-in-out infinite alternate; cursor: pointer; filter: drop-shadow(0 6px 6px rgba(0,0,0,.25)); }
.home-leader .bubble { background: #fff; color: #3a2a3a; font-weight: 800; font-size: 13px; padding: 8px 14px; border-radius: 16px; position: relative; max-width: 260px; text-align: center; border: 3px solid #3a2a3a; }
.home-leader .bubble::after { content: ''; position: absolute; left: 50%; bottom: -11px; border: 8px solid transparent; border-top-color: #3a2a3a; transform: translateX(-50%); }
.home-name { background: rgba(26,42,106,.85); padding: 2px 12px; border-radius: 99px; font-size: 12px; font-weight: 900; margin-top: -6px; }
.home-info { position: relative; display: flex; gap: 6px; margin: 8px 0; }
.home-info div { background: rgba(26,42,106,.8); padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 800; }
.home-info b { color: #ffe23b; font-size: 14px; }
.home-btns { position: relative; display: flex; gap: 10px; width: 100%; padding: 0 14px; }
.bigbtn { flex: 1; border: none; border-radius: 18px; padding: 14px 6px; color: #fff; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 3px solid #fff; }
.bigbtn b { font-size: 24px; font-weight: 900; color: #fff; text-shadow: 1.5px 0 0 rgba(0,0,0,.35), -1.5px 0 0 rgba(0,0,0,.35), 0 1.5px 0 rgba(0,0,0,.35), 0 -1.5px 0 rgba(0,0,0,.35), 0 3px 0 rgba(0,0,0,.35); }
.bigbtn small { font-size: 10px; font-weight: 800; }
.bigbtn.quest { background: linear-gradient(#ff9a3a, #e8541e); box-shadow: 0 5px 0 #8a2a00; }
.bigbtn.gacha { background: linear-gradient(135deg, #ff5a8a, #b45cff 50%, #3b86ff); box-shadow: 0 5px 0 #4a1a8a; }
.bigbtn:active { transform: translateY(3px); box-shadow: none; }
.home-sub { position: relative; display: flex; gap: 8px; margin-top: 14px; }

/* クエスト */
.qs { padding-bottom: 14px; }
.area { position: relative; margin: 8px 12px; height: 92px; border-radius: 16px; overflow: hidden; border: 3px solid #fff; box-shadow: 0 4px 0 rgba(0,0,0,.3); cursor: pointer; }
.area-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.area::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, var(--ac) 30%, transparent 75%); opacity: .92; }
.area-no { position: absolute; left: 12px; top: 8px; font-size: 11px; font-weight: 900; background: rgba(0,0,0,.3); padding: 1px 8px; border-radius: 99px; }
.area-nm { position: absolute; left: 12px; top: 28px; font-size: 21px; font-weight: 900; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
.area-nm small { display: block; font-size: 11px; opacity: .9; }
.area-pr { position: absolute; left: 96px; top: 11px; display: flex; gap: 3px; }
.area-pr i { width: 12px; height: 12px; border-radius: 50%; background: rgba(0,0,0,.35); border: 1.5px solid #fff; }
.area-pr i.on { background: #ffe23b; }
.area-boss { position: absolute; right: 4px; bottom: -14px; height: 120px; }
.area.lock { filter: grayscale(.9) brightness(.7); }
.area-lock { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.45); font-weight: 900; font-size: 13px; }
.qs-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 4px; }
.qs-head h2 { margin: 0; font-size: 17px; font-weight: 900; color: #fff; text-shadow: 1.5px 0 0 #1a3a9a, -1.5px 0 0 #1a3a9a, 0 1.5px 0 #1a3a9a, 0 -1.5px 0 #1a3a9a, 1.0px 1.0px 0 #1a3a9a, -1.0px 1.0px 0 #1a3a9a, 1.0px -1.0px 0 #1a3a9a, -1.0px -1.0px 0 #1a3a9a, 0 3px 0 #1a3a9a; }
.stage { position: relative; display: flex; align-items: center; gap: 8px; margin: 8px 12px; padding: 8px 10px; background: linear-gradient(#fff, #f0f6ff); color: #2a2a4a; border-radius: 14px;
  border: 3px solid #3b86ff; box-shadow: 0 4px 0 #1550b8; cursor: pointer; }
.stage.clr { border-color: #35c45a; box-shadow: 0 4px 0 #16803a; }
.stage.lock { filter: grayscale(1); opacity: .6; }
.st-id { font-weight: 900; font-size: 15px; color: #fff; background: #3b86ff; border-radius: 8px; padding: 2px 6px; }
.stage.clr .st-id { background: #35c45a; }
.st-nm { flex: 1; min-width: 0; }
.st-nm b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-nm small { font-size: 10px; color: #6a6a8a; font-weight: 700; }
.st-en { display: flex; }
.st-en img { width: 34px; height: 34px; border-radius: 50%; background: #e8eef8; border: 2px solid #fff; margin-left: -8px; }
.st-mk { position: absolute; right: -4px; top: -10px; font-size: 10px; font-weight: 900; background: #e8343a; color: #fff; padding: 1px 7px; border-radius: 99px; border: 2px solid #fff; }
.stage.clr .st-mk { background: #35c45a; }
.sd-en { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.sd-e { width: 58px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.sd-e .fc { background: #e8eef8; border-color: var(--ac); }
.sd-e small { font-size: 9px; line-height: 1.2; }
.sd-party { display: flex; gap: 5px; justify-content: center; margin-top: 8px; }
.sd-party .fc { width: 52px; }

/* 編成 */
.pt { padding-bottom: 16px; }
.pt-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 0 10px; }
.pt-col { background: rgba(255,255,255,.7); border-radius: 14px; padding: 6px 5px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #2a2a4a; border: 2px solid #fff; position: relative; }
.pt-no { position: absolute; top: -8px; left: -4px; width: 20px; height: 20px; border-radius: 50%; background: #e8343a; font-size: 11px; font-weight: 900; color: #fff; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; z-index: 2; }
.pslot { position: relative; width: 100%; cursor: pointer; }
.pslot.empty { aspect-ratio: 1; border: 2.5px dashed #9aa4c8; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,.5); }
.pslot.empty > span:first-child { font-size: 24px; color: #9aa4c8; font-weight: 900; }
.pslot .pl { position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%); font-size: 8px; font-weight: 900; background: #ff7a1e; color: #fff; padding: 0 4px; border-radius: 6px; white-space: nowrap; }
.pt-sups { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; width: 100%; }
.pslot.sup .fc { border-width: 2px; border-radius: 8px; }
.pslot.sup .fc-r, .pslot.sup .fc-lv { display: none; }
.pslot.sup.empty { border-radius: 8px; border-width: 2px; }
.pslot.sup.empty > span:first-child { font-size: 14px; }
.ps-st { font-size: 9px; font-weight: 800; display: flex; flex-direction: column; align-items: center; line-height: 1.3; }
.ps-st .boost { color: #e8541e; }
.pt-row { padding: 8px 10px 0; }
.pt-legend { display: flex; align-items: center; gap: 10px; background: linear-gradient(90deg, #3a1a6a, #6a3ab0); border-radius: 14px; padding: 6px 10px; border: 2px solid #ffcf3a; cursor: pointer; }
.pt-legend img { width: 54px; height: 54px; border-radius: 50%; border: 2px solid #ffcf3a; background: #fff3; }
.pt-legend small { display: block; font-size: 10px; color: #ffcf3a; font-weight: 900; }
.pt-legend b { display: block; font-size: 15px; }
.pt-legend span { font-size: 10px; opacity: .85; }

// ============================================================
//  Util: DOM ヘルパー・待機・効果音
// ============================================================
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
const fmt = n => Math.max(0, Math.round(n)).toLocaleString();
const rint = n => Math.floor(Math.random() * n);
const pick = arr => arr[rint(arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const gameSpeed = () => (window.Save && Save.data && Save.data.settings.speed) || 1;
// バトル速度設定を反映した待機
const wait = ms => new Promise(r => setTimeout(r, ms / gameSpeed()));
const sleepRaw = ms => new Promise(r => setTimeout(r, ms));
const stars = n => '★'.repeat(n);

function toast(text, ms = 1600) {
  const t = el('div', 'toast', text);
  document.body.appendChild(t);
  setTimeout(() => t.classList.add('out'), ms);
  setTimeout(() => t.remove(), ms + 400);
}

// ---------- 効果音 (WebAudio で合成) ----------
const Sfx = (() => {
  let ctx = null;
  function ac() {
    if (!ctx) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; }
    }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  const on = () => !window.Save || !Save.data || Save.data.settings.sound !== false;
  function tone(freq, dur, type = 'sine', vol = 0.12, slide = 0, delay = 0) {
    if (!on()) return;
    const a = ac(); if (!a) return;
    const t0 = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noise(dur, vol = 0.15, lp = 1800, delay = 0) {
    if (!on()) return;
    const a = ac(); if (!a) return;
    const t0 = a.currentTime + delay;
    const len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp;
    const g = a.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(a.destination);
    s.start(t0);
  }
  return {
    unlock: ac,
    tap: () => tone(660, 0.06, 'triangle', 0.08),
    pop: n => { tone(520 + Math.min(n, 14) * 45, 0.12, 'sine', 0.13, 1.6); if (n >= 7) tone(1046, 0.25, 'triangle', 0.1, 1, 0.08); },
    heal: () => { tone(784, 0.14, 'sine', 0.1); tone(988, 0.14, 'sine', 0.1, 1, 0.09); tone(1318, 0.2, 'sine', 0.1, 1, 0.18); },
    hit: (big) => { noise(big ? 0.35 : 0.14, big ? 0.28 : 0.16, big ? 900 : 2200); tone(big ? 110 : 180, big ? 0.3 : 0.1, 'square', 0.06, 0.5); },
    boom: () => { noise(0.6, 0.3, 700); tone(80, 0.5, 'sawtooth', 0.08, 0.4); },
    special: () => { tone(392, 0.18, 'square', 0.07); tone(523, 0.18, 'square', 0.07, 1, 0.12); tone(784, 0.4, 'square', 0.08, 1, 0.24); },
    enemy: () => { noise(0.3, 0.22, 600); tone(140, 0.3, 'sawtooth', 0.08, 0.6); },
    deny: () => tone(180, 0.15, 'square', 0.06),
    ok: () => { tone(880, 0.08, 'triangle', 0.08); tone(1320, 0.12, 'triangle', 0.08, 1, 0.07); },
    win: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.3, 'triangle', 0.1, 1, i * 0.12)),
    lose: () => [392, 330, 262].forEach((f, i) => tone(f, 0.4, 'sine', 0.1, 1, i * 0.2)),
    gacha: (r) => {
      if (r >= 5) [523, 659, 784, 1046, 1318, 1568].forEach((f, i) => tone(f, 0.35, 'triangle', 0.09, 1, i * 0.07));
      else if (r === 4) [523, 784, 1046].forEach((f, i) => tone(f, 0.25, 'triangle', 0.09, 1, i * 0.08));
      else tone(660, 0.15, 'triangle', 0.08);
    },
    charge: () => tone(300, 0.6, 'sawtooth', 0.05, 3),
  };
})();

// ============================================================
//  Art: SVG ちびキャラ・モンスター・背景の生成
// ============================================================
const Art = (() => {
  let uid = 0;
  const urlCache = new Map();
  const imgCache = new Map();

  // ---------- ユーティリティ ----------
  function hash(s) {
    let h = 2166136261;
    for (const ch of String(s)) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shade(hex, amt) {
    let c = hex.replace('#', '');
    if (c.length === 3) c = c.split('').map(x => x + x).join('');
    const n = parseInt(c, 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    if (amt < 0) { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
    else { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
    return '#' + [r, g, b].map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
  }
  const f = v => (Math.round(v * 10) / 10).toString();
  const P = (cx, cy, r, a) => [cx + r * Math.cos(a * Math.PI / 180), cy + r * Math.sin(a * Math.PI / 180)];
  const lg = (id, c1, c2, x2 = 0, y2 = 1) =>
    `<linearGradient id="${id}" x1="0" y1="0" x2="${x2}" y2="${y2}"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>`;
  const rg = (id, c1, c2, cx = 0.35, cy = 0.3) =>
    `<radialGradient id="${id}" cx="${cx}" cy="${cy}" r="0.75"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></radialGradient>`;

  const VIEW = '-6 -24 132 170';
  const wrap = (body, defs, view = VIEW) =>
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${view}"><defs>${defs}</defs>${body}</svg>`;

  // ---------- 髪 ----------
  // 頭頂部の髪 (トゲ/もこもこ) + 前髪 を 1 本のパスで生成
  function hairPath(h, rnd) {
    const cx = 60, cy = h.cy ?? 58, rb = h.rb ?? 40;
    const a0 = h.a0 ?? -195, a1 = h.a1 ?? 15;
    const n = h.n ?? 8;
    const sideY = h.side ?? 70;
    const sideX = h.sideX ?? 38.5;
    let d = `M${f(cx - sideX)} ${f(sideY)}`;
    const s0 = P(cx, cy, rb, a0);
    d += ` L${f(s0[0])} ${f(s0[1])}`;
    const step = (a1 - a0) / n;
    const lens = h.lens;
    for (let i = 0; i < n; i++) {
      const sa = a0 + i * step, ea = sa + step, ma = (sa + ea) / 2;
      const t = Math.max(-1, Math.min(1, (ma + 90) / 90));
      let L = h.len ?? 14;
      if (h.profile === 'top') L *= 1 - 0.5 * Math.abs(t);
      else if (h.profile === 'side') L *= 0.55 + 0.6 * Math.abs(t);
      else if (h.profile === 'right') L *= 0.6 + 0.5 * (t + 1) / 2;
      L *= 1 + (rnd() - 0.5) * (h.vary ?? 0.45);
      if (lens) L = lens[i % lens.length];
      const lean = h.lean ?? 0.3;
      // 下向きになりすぎないよう角度を制限 (横の毛が細い線にならないように)
      const ta = Math.max(-202, Math.min(22, ma + lean * (ma + 90) + (h.tilt ?? 0)));
      if (ma < -186 || ma > 6) L *= 0.55;
      const e = P(cx, cy, rb, ea);
      if (h.style === 'puff') {
        const c = P(cx, cy, rb + L * 1.6, ma);
        d += ` Q${f(c[0])} ${f(c[1])} ${f(e[0])} ${f(e[1])}`;
      } else if (h.style === 'smooth') {
        const c = P(cx, cy, rb + L, ma);
        d += ` Q${f(c[0])} ${f(c[1])} ${f(e[0])} ${f(e[1])}`;
      } else {
        const tip = P(cx, cy, rb + L, ta);
        const w = h.curve ?? 0;
        if (w) {
          const m1 = P(cx, cy, rb + L * 0.55, ta - w);
          d += ` Q${f(m1[0])} ${f(m1[1])} ${f(tip[0])} ${f(tip[1])} L${f(e[0])} ${f(e[1])}`;
        } else d += ` L${f(tip[0])} ${f(tip[1])} L${f(e[0])} ${f(e[1])}`;
      }
    }
    d += ` L${f(cx + sideX)} ${f(sideY)}`;
    // 前髪
    const line = h.line ?? 45;
    const yl = x => line + (sideY - 3 - line) * Math.pow((x - 60) / 36.5, 2);
    const b = h.bangs || {};
    const bn = b.n ?? 5;
    if (b.skip) {
      // 生え際なし (モヒカン等)
    } else if (b.flat) {
      const cut = line + (b.len ?? 12);
      d += ` L${f(96.5)} ${f(sideY - 3)} L${f(93)} ${f(cut + 4)} Q60 ${f(cut + 2)} 27 ${f(cut + 4)} L23.5 ${f(sideY - 3)}`;
    } else if (bn > 0) {
      const xR = 96.5, xL = 23.5;
      const bw = (xR - xL) / bn;
      d += ` L${f(xR)} ${f(yl(xR))}`;
      for (let j = 0; j < bn; j++) {
        const xa = xR - j * bw, xb = xa - bw, xm = (xa + xb) / 2;
        let len = b.lens ? b.lens[j % b.lens.length] : (b.len ?? 10) * (1 + (rnd() - 0.5) * (b.vary ?? 0.5));
        if (b.center) len *= 1 - 0.35 * Math.abs(xm - 60) / 36;
        const lean = b.leanX ?? ((xm - 60) * (b.lean ?? 0.12));
        const tipX = xm + lean, tipY = yl(xm) + len;
        if (b.style === 'puff') d += ` Q${f(xm + lean * 0.5)} ${f(yl(xm) + len * 1.5)} ${f(xb)} ${f(yl(xb))}`;
        else d += ` L${f(tipX)} ${f(tipY)} L${f(xb)} ${f(yl(xb))}`;
      }
    } else {
      d += ` L96.5 ${f(sideY - 3)} Q60 ${f(line - 4)} 23.5 ${f(sideY - 3)}`;
    }
    return d + ' Z';
  }

  function backHair(h, hairFill, st) {
    const t = h.back;
    if (!t) return '';
    if (typeof t === 'object') {
      // 後ろ側のトゲ (頭の後ろに描く)

  // ---------- ちびキャラ本体 ----------
  function chibi(c) {
    const id = 'g' + (uid++);
    const O = c.outline || '#2a1a16';
    const st = `stroke="${O}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"`;
    const sk = c.skin || '#ffdcc0';
    const rnd = rng(hash(c.seed || c.name || id));
    const H = c.hair;
    const acc = new Set(c.acc || []);
    const wpn = new Set(c.wpn || []);
    const defs = [];
    const L = [];
    defs.push(rg(id + 's', shade(sk, 0.1), shade(sk, -0.07), 0.4, 0.35));
    let hairFill = '#222';
    if (H) {
      defs.push(lg(id + 'h', shade(H.c, 0.22), H.c2 || shade(H.c, -0.25)));
      hairFill = `url(#${id}h)`;
    }
    // 影
    L.push(`<ellipse cx="60" cy="137" rx="28" ry="5" fill="#000" opacity=".22"/>`);
    // 後ろ
    L.push(accBack(acc, O, st, c));
    L.push(weaponsBack(wpn, O, st));
    if (H) L.push(backHair(H, hairFill, st));
    // 体
    L.push(body(c, O, st, sk, id, defs));
    const am = arms(c, O, st, sk);
    L.push(am.arms);
    L.push(weaponsHand(wpn, O, st));
    L.push(hands(c, O, st, sk));
    // 頭
    const sp = specialHead(c, O, st);
    if (sp) L.push(sp);
    else {
      L.push(`<ellipse cx="22.5" cy="71" rx="5" ry="7" fill="${sk}" ${st}/><ellipse cx="97.5" cy="71" rx="5" ry="7" fill="${sk}" ${st}/>`);
      if (c.ears === 'elf') L.push(`<path d="M24 66 L8 54 L22 78 Z M96 66 L112 54 L98 78 Z" fill="${sk}" ${st}/>`);
      L.push(`<ellipse cx="60" cy="63" rx="37" ry="34" fill="url(#${id}s)" ${st}/>`);
      // 目・眉・口
      if (!acc.has('blindfold')) L.push(eyes(c.eye || {}, O, id, defs));
      L.push(marks(c.marks, O, sk, false));
      if (!acc.has('mask') && !acc.has('bandage')) L.push(mouth(c.mouth, O));
      if (c.head === 'bald') L.push(`<ellipse cx="46" cy="40" rx="9" ry="5" fill="#fff" opacity=".45" transform="rotate(-25 46 40)"/>`);
      // 前髪
      if (H && !H.none) {
        L.push(`<path d="${hairPath(H, rnd)}" fill="${hairFill}" ${st}/>`);
        if (H.hl !== false) {
        const hl1 = P(60, H.cy ?? 58, (H.rb ?? 40) - 5, -150), hl2 = P(60, H.cy ?? 58, (H.rb ?? 40) - 5, -112);
        L.push(`<path d="M${f(hl1[0])} ${f(hl1[1])} Q${f(P(60, H.cy ?? 58, (H.rb ?? 40) - 3, -131)[0])} ${f(P(60, H.cy ?? 58, (H.rb ?? 40) - 3, -131)[1])} ${f(hl2[0])} ${f(hl2[1])}" stroke="#fff" stroke-opacity=".45" stroke-width="3.2" fill="none" stroke-linecap="round"/>`);
        }
        if (H.strand) L.push(`<path d="M${H.strand} 44 Q${H.strand - 4} 60 ${H.strand + 2} 74" stroke="${O}" stroke-width="4.4" fill="none" stroke-linecap="round"/><path d="M${H.strand} 44 Q${H.strand - 4} 60 ${H.strand + 2} 74" stroke="${H.c}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`);
      }
      L.push(brows(c.brow ?? 'n', O, H && !H.none ? H.c : null));
      L.push(marks(c.marks, O, sk, true));
    }
    L.push(accFront(acc, O, st, c));

  }

  return { chibi, monster, url, faceUrl, image, sceneUrl, shade, hash, rng, setCustom, hasCustom };
